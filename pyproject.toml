[project]
name = "birdfeed"
version = "0.2.0"
description = "Scrapes reputable sources for avian influenza news and serves an academic newsletter feed with a weekly AI summary."
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "flask>=3.0",
    "waitress>=3.0",
    "APScheduler>=3.10",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.scripts]
birdfeed = "birdfeed.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
birdfeed = ["templates/*.html", "static/*.css"]
